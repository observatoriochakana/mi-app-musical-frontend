<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EthnoSynth Studio - DAW</title>
    <style>
        :root {
            --bg-dark: #121212;
            --bg-panel: #1e1e1e;
            --bg-panel-light: #2d2d2d;
            --text-main: #e0e0e0;
            --text-muted: #888;
            --accent-blue: #007bff;
            --accent-red: #e74c3c;
            --accent-green: #27ae60;
            --accent-orange: #e67e22;
            --border-color: #333;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; background-color: var(--bg-dark); color: var(--text-main); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* Barra Superior */
        .top-bar { background-color: var(--bg-panel); padding: 10px 20px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .top-bar h1 { margin: 0; font-size: 1.2rem; color: var(--accent-blue); letter-spacing: 1px; }
        
        /* Layout Principal */
        .main-layout { display: flex; flex: 1; overflow: hidden; width: 100%; height: 100vh; }
.sidebar { flex: 0 0 300px; /* Ancho fijo de 300px */ }
.editor-area { flex: 1; min-width: 0; /* Permite que el editor se encoja */ }
        
        /* Panel Izquierdo (Controles) */
        .sidebar { width: 300px; background-color: var(--bg-panel); border-right: 1px solid var(--border-color); padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; }
        .control-group { background-color: var(--bg-panel-light); padding: 10px; border-radius: 6px; border: 1px solid var(--border-color); }
        .control-group h3 { margin: 0 0 10px 0; font-size: 0.9rem; color: var(--text-muted); text-transform: uppercase; }
        
        /* Controles de Entrada */
        button { cursor: pointer; background-color: var(--bg-panel-light); color: var(--text-main); border: 1px solid var(--border-color); padding: 8px 12px; border-radius: 4px; font-weight: bold; transition: all 0.2s; width: 100%; margin-bottom: 5px; }
        button:hover { background-color: #3d3d3d; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-record { background-color: var(--accent-red); border-color: var(--accent-red); }
        .btn-record:hover { background-color: #c0392b; }
        .btn-play { background-color: var(--accent-green); border-color: var(--accent-green); color: white; }
        .btn-export { background-color: var(--accent-blue); border-color: var(--accent-blue); color: white; }
        
        /* Deslizadores */
        input[type="range"] { width: 100%; margin: 5px 0; accent-color: var(--accent-blue); }
        label { font-size: 0.85rem; color: var(--text-muted); display: block; margin-top: 5px; }
        
        /* Área del Piano Roll */
        .editor-area { flex: 1; display: flex; flex-direction: column; background-color: #0a0a0a; }
        #pianoRollContainer { flex: 1; width: 100%; overflow: auto; border-bottom: 1px solid var(--border-color); }
        
        /* Piano Virtual */
        .piano-container { height: 120px; background-color: var(--bg-panel); display: flex; justify-content: center; position: relative; border-top: 1px solid var(--border-color); }
        .tecla-blanca { width: 45px; height: 100%; background: #f0f0f0; border: 1px solid #999; border-radius: 0 0 5px 5px; color: #333; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 10px; box-sizing: border-box; cursor: pointer; user-select: none; }
        .tecla-blanca:active { background: var(--accent-blue); color: white; }
        .tecla-negra { width: 30px; height: 60%; background: #222; border: 1px solid #000; border-radius: 0 0 3px 3px; color: #aaa; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 5px; box-sizing: border-box; position: absolute; cursor: pointer; z-index: 2; user-select: none; }
        .tecla-negra:active { background: var(--accent-blue); }
        
        /* Badges y Textos */
        .status-text { font-size: 0.9rem; color: var(--accent-red); font-weight: bold; height: 20px; margin-top: 10px; }
        
        @media (max-width: 768px) {
            .main-layout { flex-direction: column; }
            .sidebar { width: 100%; height: 40%; border-right: none; border-bottom: 1px solid var(--border-color); }
            .tecla-blanca { width: 35px; }
        }
    </style>
</head>
<body>
    <!-- Barra Superior -->
    <div class="top-bar">
        <h1>🌌 EthnoSynth Studio</h1>
        <div style="font-size: 0.8rem; color: var(--text-muted);">Proyecto: Sin título</div>
    </div>

    <!-- Layout Principal -->
    <div class="main-layout">
        <!-- Panel Izquierdo: Controles y Efectos -->
        <div class="sidebar">
            <!-- Grabación -->
            <div class="control-group">
                <h3>Grabación</h3>
                <button id="botonGrabarPiano" class="btn-record">🔴 Grabar (Piano)</button>
                <button id="botonGrabarMicro" style="background-color: var(--accent-orange); border-color: var(--accent-orange);">🎤 Grabar (Micrófono)</button>
                <button id="botonDetenerGrabacion" disabled>⏹️ Detener</button>
                <button id="botonLimpiar" style="margin-top: 10px; background: transparent; border: 1px solid #555;">🗑️ Limpiar Pista</button>
                <div id="estadoGrabacion" class="status-text"></div>
            </div>

            <!-- Instrumento -->
            <div class="control-group">
                <h3>Instrumento</h3>
                <select id="selectorInstrumentoUsuario" style="width: 100%; padding: 8px; background: var(--bg-dark); color: white; border: 1px solid var(--border-color); border-radius: 4px;">
                    <option value="acoustic_grand_piano">Piano</option>
                    <!-- Aquí se cargarán los .sf2 -->
                </select>
            </div>

            <!-- Efectos -->
            <div class="control-group">
                <h3>Rack de Efectos</h3>
                <label>Reverb: <span id="valReverb">30</span>%</label>
                <input type="range" id="reverbSlider" min="0" max="100" value="30">
                
                <label>Delay: <span id="valDelay">20</span>%</label>
                <input type="range" id="delaySlider" min="0" max="100" value="20">
                
                <label>Flanger: <span id="valFlanger">0</span>%</label>
                <input type="range" id="flangerSlider" min="0" max="100" value="0">
                
                <label>Wah-Wah: <span id="valWah">0</span>%</label>
                <input type="range" id="wahSlider" min="0" max="100" value="0">
            </div>

            <!-- Acciones -->
            <div class="control-group">
                <h3>Acciones</h3>
                <button id="botonReproducirMelodia" class="btn-play">🎹 Reproducir Pista</button>
                <button id="botonExportarAudio" class="btn-export">💾 Exportar WAV</button>
            </div>
        </div>

        <!-- Área Central: Piano Roll y Piano Virtual -->
        <div class="editor-area">
            <div id="pianoRollContainer"></div>
            <div class="piano-container" id="pianoVirtual"></div>
        </div>
    </div>

    <!-- LIBRERÍAS -->
    <script src="https://cdn.jsdelivr.net/npm/soundfont-player@0.12.0/dist/soundfont-player.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/spessasynth_lib@4.4.7/dist/spessasynth_lib.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/konva@9.2.0/konva.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
