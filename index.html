<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EthnoSynth Studio - DAW</title>
    <style>
        :root {
            --bg-dark: #121212;
            --bg-panel: #1e1e1e;
            --bg-panel-light: #2d2d2d;
            --text-main: #e0e0e0;
            --text-muted: #888;
            --accent-blue: #007bff;
            --accent-red: #e74c3c;
            --accent-green: #27ae60;
            --accent-orange: #e67e22;
            --border-color: #333;
        }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; background-color: var(--bg-dark); color: var(--text-main); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        .top-bar { background-color: var(--bg-panel); padding: 10px 20px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; flex: 0 0 auto; }
        .top-bar h1 { margin: 0; font-size: 1.2rem; color: var(--accent-blue); letter-spacing: 1px; }

        .main-layout { display: flex; flex: 1; overflow: hidden; width: 100%; }

        .sidebar { flex: 0 0 300px; background-color: var(--bg-panel); border-right: 1px solid var(--border-color); padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; z-index: 10; }
        .control-group { background-color: var(--bg-panel-light); padding: 10px; border-radius: 6px; border: 1px solid var(--border-color); }
        .control-group h3 { margin: 0 0 10px 0; font-size: 0.9rem; color: var(--text-muted); text-transform: uppercase; }

        button { cursor: pointer; background-color: var(--bg-panel-light); color: var(--text-main); border: 1px solid var(--border-color); padding: 8px 12px; border-radius: 4px; font-weight: bold; transition: all 0.2s; width: 100%; margin-bottom: 5px; }
        button:hover { background-color: #3d3d3d; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-record { background-color: var(--accent-red); border-color: var(--accent-red); }
        .btn-play { background-color: var(--accent-green); border-color: var(--accent-green); color: white; }
        .btn-export { background-color: var(--accent-blue); border-color: var(--accent-blue); color: white; }

        input[type="range"] { width: 100%; margin: 5px 0; accent-color: var(--accent-blue); }
        label { font-size: 0.85rem; color: var(--text-muted); display: block; margin-top: 5px; }

        .editor-area { flex: 1; min-width: 0; display: flex; flex-direction: column; background-color: #0a0a0a; }
        #pianoRollContainer { flex: 1; width: 100%; overflow: auto; border-bottom: 1px solid var(--border-color); }

        .piano-container {
            height: 120px;
            background-color: var(--bg-panel);
            display: flex;
            justify-content: flex-start;
            position: relative;
            border-top: 1px solid var(--border-color);
            flex: 0 0 auto;
            overflow-x: auto;
            overflow-y: hidden;
            -webkit-overflow-scrolling: touch;
            padding: 0 10px;
        }
        .tecla-blanca {
            width: 45px;
            height: 100%;
            background: #f0f0f0;
            border: 1px solid #999;
            border-radius: 0 0 5px 5px;
            color: #333;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 10px;
            box-sizing: border-box;
            cursor: pointer;
            user-select: none;
            flex-shrink: 0;
            touch-action: none;
        }
        .tecla-blanca:active { background: var(--accent-blue); color: white; }
        .tecla-blanca.pressed {
            background: var(--accent-red);
            color: white;
            transform: scaleY(0.97);
        }

        .status-text { font-size: 0.9rem; color: var(--accent-red); font-weight: bold; height: 20px; margin-top: 10px; }

        @media (max-width: 768px) {
            .main-layout { flex-direction: column; }
            .sidebar { flex: 0 0 auto; max-height: 40%; border-right: none; border-bottom: 1px solid var(--border-color); }
            .tecla-blanca { width: 35px; }
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <h1>🌌 EthnoSynth Studio</h1>
        <div style="font-size: 0.8rem; color: var(--text-muted);">Proyecto: Sin título</div>
    </div>

    <div class="main-layout">
        <div class="sidebar">
            <div class="control-group">
                <h3>⚙️ Panel de Administración</h3>
                <input type="text" id="nuevoNombreEtnicos" placeholder="Nombre del instrumento" style="width: 90%; padding: 5px; margin-bottom: 5px; background: #111; color: white; border: 1px solid #444;">
                <input type="file" id="archivoSF2" accept=".sf2" style="width: 100%; margin-bottom: 5px; color: white;">
                <input type="number" id="programaSF2" placeholder="Programa (0)" value="0" style="width: 90%; padding: 5px; margin-bottom: 5px; background: #111; color: white; border: 1px solid #444;">
                <button id="botonCargarSF2" style="background-color: #8e44ad;">⬆️ Subir .sf2 al servidor</button>
            </div>

            <div class="control-group">
                <h3>Grabación</h3>
                <button id="botonGrabarPiano" class="btn-record">🔴 Grabar (Piano)</button>
                <button id="botonDetenerGrabacion" disabled>⏹️ Detener</button>
                <button id="botonLimpiar" style="margin-top: 10px; background: transparent; border: 1px solid #555;">🗑️ Limpiar Pista</button>
                <div id="estadoGrabacion" class="status-text"></div>
            </div>

            <div class="control-group">
                <h3>Instrumento</h3>
                <select id="selectorInstrumentoUsuario" style="width: 100%; padding: 8px; background: var(--bg-dark); color: white; border: 1px solid var(--border-color); border-radius: 4px;">
                    <option value="acoustic_grand_piano">Piano</option>
                </select>
            </div>

            <div class="control-group">
                <h3>Rack de Efectos</h3>
                <label>Reverb: <span id="valReverb">30</span>%</label>
                <input type="range" id="reverbSlider" min="0" max="100" value="30">
                <label>Delay: <span id="valDelay">20</span>%</label>
                <input type="range" id="delaySlider" min="0" max="100" value="20">
            </div>

            <div class="control-group">
                <h3>Acciones</h3>
                <button id="botonReproducirMelodia" class="btn-play">🎹 Reproducir Pista</button>
                <button id="botonExportarAudio" class="btn-export">💾 Exportar WAV</button>
            </div>
        </div>

        <div class="editor-area">
            <div id="pianoRollContainer"></div>
            <div class="piano-container" id="pianoVirtual"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/soundfont-player@0.12.0/dist/soundfont-player.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/konva@9.2.0/konva.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
