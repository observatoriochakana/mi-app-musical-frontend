<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EthnoReaper Studio v1.4</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #121316;
            --bg-panel: #1a1c22;
            --bg-track: #23262f;
            --primary: #ea4335;
            --text-main: #f5f6f8;
            --text-muted: #9ea2ae;
            --accent-glow: rgba(234, 67, 53, 0.15);
        }
        body {
            margin: 0;
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
        }
        .studio-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        .top-bar {
            background-color: var(--bg-panel);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #2d313c;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            color: var(--primary);
        }
        .strip-group {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .warm-select {
            background-color: var(--bg-track);
            color: var(--text-main);
            border: 1px solid #3c4252;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
        }
        .daw-workspace {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        .tracks-panel {
            width: 280px;
            background-color: var(--bg-panel);
            border-right: 1px solid #2d313c;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .track-item {
            background-color: var(--bg-track);
            border-radius: 8px;
            padding: 12px;
            border-left: 4px solid var(--primary);
        }
        .track-header {
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
        }
        .track-controls {
            display: flex;
            gap: 6px;
        }
        .btn-secondary-warm {
            background: #2d313c;
            color: var(--text-main);
            border: none;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
        }
        .btn-secondary-warm:hover {
            background: #3c4252;
        }
        .timeline-canvas {
            flex: 1;
            background-color: var(--bg-dark);
            position: relative;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <div class="studio-container">
        <header class="top-bar">
            <div class="logo-area">
                <span class="material-icons">graphic_eq</span>
                <span>EthnoReaper Studio</span>
            </div>
            <div class="strip-group">
                <label>Escala / Microtonalidad:</label>
                <select id="scale-select" class="warm-select">
                    <option value="Cromática">Cromática (12 notas)</option>
                    <option value="Pentatónica Menor">Pentatónica Menor (Andina)</option>
                    <option value="Pentatónica Mayor">Pentatónica Mayor</option>
                    <option value="Mixolidia">Mixolidia (Funk Étnico)</option>
                    <option value="Dórica">Dórica (Ambient / Dub)</option>
                    <option value="Frigia">Frigia (Trance / Ritual)</option>
                    <option value="Maqam Hijaz">Maqam Hijaz (Árabe / Microtonal)</option>
                    <option value="Raga Bhairav">Raga Bhairav (India)</option>
                    <option value="Pelog">Pelog (Gamelán / Indonesia)</option>
                </select>
            </div>
        </header>

        <main class="daw-workspace">
            <aside class="tracks-panel">
                <div class="panel-title">Pistas (TCP)</div>
                <div class="track-item">
                    <div class="track-header">🪕 Instrumento Étnico</div>
                    <div class="track-controls">
                        <button class="btn-secondary-warm">Mute</button>
                        <button class="btn-secondary-warm">Solo</button>
                    </div>
                </div>
                <div class="track-item">
                    <div class="track-header">🎤 Toma Acústica / Micrófono</div>
                    <div class="track-controls">
                        <button class="btn-secondary-warm">Mute</button>
                        <button class="btn-secondary-warm">Solo</button>
                    </div>
                </div>
            </aside>
            <section class="timeline-canvas">
                <!-- Regiones de audio y secuenciador -->
            </section>
        </main>
    </div>
</body>
</html>
