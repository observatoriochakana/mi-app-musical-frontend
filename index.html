<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EthnoSynth Studio - DAW</title>
    <style>
        :root {
            --bg-dark: #121212;
            --bg-panel: #1e1e1e;
            --bg-panel-light: #2d2d2d;
            --text-main: #e0e0e0;
            --text-muted: #888;
            --accent-blue: #007bff;
            --accent-red: #e74c3c;
            --accent-green: #27ae60;
            --accent-orange: #e67e22;
            --border-color: #333;
        }
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; background-color: var(--bg-dark); color: var(--text-main); display: flex; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden; }

        .top-bar { background-color: var(--bg-panel); padding: 10px 15px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; flex: 0 0 auto; gap: 10px; }
        .top-bar h1 { margin: 0; font-size: 1.1rem; color: var(--accent-blue); letter-spacing: 1px; white-space: nowrap; }
        .status-banner { font-size: 0.85rem; color: var(--accent-green); font-weight: bold; background: #141414; padding: 4px 12px; border-radius: 12px; border: 1px solid #2b2b2b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .top-bar .project-info { font-size: 0.75rem; color: var(--text-muted); white-space: nowrap; }

        .main-layout { display: flex; flex: 1; overflow: hidden; width: 100%; }

        .sidebar { flex: 0 0 280px; background-color: var(--bg-panel); border-right: 1px solid var(--border-color); padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; z-index: 10; }
        .control-group { background-color: var(--bg-panel-light); padding: 10px; border-radius: 6px; border: 1px solid var(--border-color); }
        .control-group h3 { margin: 0 0 10px 0; font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; }

        button { cursor: pointer; background-color: var(--bg-panel-light); color: var(--text-main); border: 1px solid var(--border-color); padding: 8px 12px; border-radius: 4px; font-weight: bold; transition: all 0.2s; width: 100%; margin-bottom: 5px; }
        button:hover:not(:disabled) { filter: brightness(1.15); }
        button:disabled { opacity: 0.45; cursor: not-allowed; }
        .btn-record { background-color: var(--accent-red); border-color: var(--accent-red); color: white; }
        .btn-play { background-color: var(--accent-green); border-color: var(--accent-green); color: white; }
        .btn-export { background-color: var(--accent-blue); border-color: var(--accent-blue); color: white; }
        .btn-mic { background-color: var(--accent-orange); border-color: var(--accent-orange); color: white; }

        input[type="range"] { width: 100%; margin: 5px 0; accent-color: var(--accent-blue); }
        label.slider-label { font-size: 0.85rem; color: var(--text-muted); display: flex; justify-content: space-between; margin-top: 5px; }
        
        .checkbox-row { display: flex; align-items: center; gap: 8px; font-size: 0.82rem; color: var(--text-main); margin-bottom: 8px; cursor: pointer; user-select: none; }
        .checkbox-row input[type="checkbox"] { accent-color: var(--accent-orange); width: 16px; height: 16px; cursor: pointer; }

        .editor-area { flex: 1; min-width: 0; display: flex; flex-direction: column; background-color: #0a0a0a; }
        
        #pianoRollContainer { flex: 1; width: 100%; overflow: auto; border-bottom: 1px solid var(--border-color); min-height: 150px; }

        .keyboard-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-panel);
            padding: 5px 10px;
            border-top: 1px solid var(--border-color);
        }
        .keyboard-controls button {
            width: auto;
            margin: 0;
            padding: 5px 15px;
            font-size: 0.8rem;
        }
        .keyboard-controls span { font-size: 0.8rem; color: var(--text-muted); }

        .piano-container { 
            height: 140px; 
            background-color: #1a1a1a; 
            position: relative; 
            flex: 0 0 auto; 
            overflow-x: auto; 
            overflow-y: hidden;
            -webkit-overflow-scrolling: touch; 
            padding: 0;
            display: flex;
        }
        
        .piano-keys-wrapper {
            position: relative;
            display: flex;
            height: 100%;
        }

        .tecla-blanca { 
            width: 50px; 
            height: 100%; 
            background: #f0f0f0; 
            border: 1px solid #999; 
            border-radius: 0 0 5px 5px; 
            color: #888; 
            display: flex; 
            align-items: flex-end; 
            justify-content: center; 
            padding-bottom: 10px; 
            cursor: pointer; 
            user-select: none; 
            flex-shrink: 0; 
            touch-action: none;
            position: relative;
            z-index: 1;
        }
        
        .tecla-blanca.pressed { background: var(--accent-blue); color: white; }

        .tecla-negra {
            position: absolute;
            width: 30px;
            height: 60%;
            background: #111;
            border: 1px solid #000;
            border-radius: 0 0 4px 4px;
            top: 0;
            z-index: 2;
            cursor: pointer;
            user-select: none;
            touch-action: none;
            box-shadow: 1px 2px 3px rgba(0,0,0,0.5);
        }
        .tecla-negra.pressed { background: var(--accent-red); }

        @media (max-width: 768px) {
            .main-layout { flex-direction: column; }
            .sidebar { flex: 0 0 auto; max-height: 42vh; border-right: none; border-bottom: 1px solid var(--border-color); padding: 10px; }
            #pianoRollContainer { min-height: 100px; }
            .tecla-blanca { width: 40px; }
            .tecla-negra { width: 24px; }
            .piano-container { height: 110px; }
            .project-info { display: none; }
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <h1>🌌 EthnoSynth Studio</h1>
        <div id="estadoGrabacion" class="status-banner">Listo para crear</div>
        <div class="project-info">Proyecto: Sin título</div>
    </div>

    <div class="main-layout">
        <div class="sidebar">
            <div class="control-group">
                <h3>🎛️ Mezcla y Exportación</h3>
                <button id="botonReproducirMelodia" class="btn-play">▶️ Reproducir Mezcla (Mic + MIDI)</button>
                <button id="botonExportarAudio" class="btn-export">💾 Exportar WAV</button>
            </div>

            <div class="control-group">
                <h3>🎤 Grabación de Micrófono</h3>
                <label class="checkbox-row">
                    <input type="checkbox" id="chkEscucharMidiAlGrabar" checked>
                    <span>🎧 Escuchar pista MIDI al grabar</span>
                </label>
                <button id="btnGrabarMicrofono" class="btn-mic">🔴 Grabar Micrófono</button>
                <button id="btnDetenerMicrofono" disabled>⏹️ Detener Micrófono</button>
                <button id="btnReproducirMicrofono" disabled style="margin-top: 5px;">🎧 Escuchar solo Mic</button>
                <button id="btnLimpiarMicrofono" style="margin-top: 5px; background: transparent; border: 1px solid #555; font-size: 0.8rem;">🗑️ Borrar Audio Mic</button>
            </div>

            <div class="control-group">
                <h3>🎹 Grabación MIDI (Piano)</h3>
                <button id="botonGrabarPiano" class="btn-record">🔴 Grabar MIDI</button>
                <button id="botonDetenerGrabacion" disabled>⏹️ Detener MIDI</button>
                <button id="botonLimpiar" style="margin-top: 5px; background: transparent; border: 1px solid #555; font-size: 0.8rem;">🗑️ Limpiar Notas MIDI</button>
            </div>

            <div class="control-group">
                <h3>🪕 Instrumento MIDI</h3>
                <select id="selectorInstrumentoUsuario" style="width: 100%; padding: 8px; background: var(--bg-dark); color: white; border: 1px solid var(--border-color); border-radius: 4px;">
                    <option value="acoustic_grand_piano">Piano (Base)</option>
                </select>
            </div>

            <div class="control-group">
                <h3>🎚️ Rack de Efectos</h3>
                <label class="slider-label">Reverb: <span><span id="valReverb">30</span>%</span></label>
                <input type="range" id="reverbSlider" min="0" max="100" value="30">
                <label class="slider-label">Delay: <span><span id="valDelay">20</span>%</span></label>
                <input type="range" id="delaySlider" min="0" max="100" value="20">
            </div>

            <div class="control-group">
                <h3>⚙️ Panel de Administración</h3>
                <input type="text" id="nuevoNombreEtnicos" placeholder="Nombre del instrumento" style="width: 100%; padding: 5px; margin-bottom: 5px; background: #111; color: white; border: 1px solid #444;">
                <input type="file" id="archivoSF2" accept=".sf2" style="width: 100%; margin-bottom: 5px; color: white; font-size: 0.8rem;">
                <button id="botonCargarSF2" style="background-color: #8e44ad;">⬆️ Subir .sf2 al servidor</button>
            </div>
        </div>

        <div class="editor-area">
            <div id="pianoRollContainer"></div>
            
            <div class="keyboard-controls">
                <button id="btnOctavaBajar" style="background: #333;">⬅️ Octava</button>
                <span id="textoOctavaActual">Do3 - Do6 (36 - 84) • Doble clic en rejilla para dibujar nota</span>
                <button id="btnOctavaSubir" style="background: #333;">Octava ➡️</button>
            </div>

            <div class="piano-container" id="pianoVirtual">
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/soundfont-player@0.12.0/dist/soundfont-player.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/konva@9.2.0/konva.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
